name: 📮 New stream / camera
description: Suggest a camera for the TrainStream list. Easiest from https://trainstream.github.io/submit/
title: "[Stream] "
labels: [submission]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a camera! (｀・ω・´)ゞ
        The easiest way is the form at **https://trainstream.github.io/submit/**: it fills in everything below for you, with a live preview.
        A maintainer reviews every suggestion before it goes on the site.
  - type: textarea
    id: stream_json
    attributes:
      label: Stream data
      description: Generated by the submit tool. Pictures must be links to images on an image host (imgur, catbox…); write the text yourself.
      render: json
      placeholder: |
        {
          "name": "湯野上温泉駅 Yunokami-Onsen Station",
          "isAlive": true,
          "tags": "trainstation, scenery",
          "region": "Fukushima",
          "description": "A thatched-roof station with five cameras.",
          "images": [{ "src": "https://i.imgur.com/example.jpg", "title": "Station", "width": 356, "height": 200 }],
          "extras": [{ "link": "https://shimogo-livecamera.jp/" }]
        }
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes for the reviewer
      description: Anything else? (optional)
  - type: checkboxes
    id: confirm
    attributes:
      label: Checklist
      options:
        - label: The pictures are links to screenshots on an image host, not files I don't have the right to share.
          required: true
        - label: I wrote the name and description myself.
          required: true
