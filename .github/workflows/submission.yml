name: Stream submissions

on:
  issues:
    types: [opened, edited, labeled, reopened]

permissions:
  contents: write
  issues: write
  pages: write

# One at a time, so two publishes never race on _data/streams.json.
concurrency:
  group: streams-json
  cancel-in-progress: false

jobs:
  process:
    if: >-
      !github.event.issue.pull_request &&
      (contains(github.event.issue.labels.*.name, 'submission') || contains(github.event.issue.body, '### Stream data'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate and publish
        run: node scripts/process-submission.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
